# TeremFlow — Render Blueprint
# After first deploy: In Dashboard set TASKS_DAILY_SECRET (same value) on BOTH teremflow-api and teremflow-daily-tasks.

databases:
  - name: teremflow-db
    plan: basic-1gb
    postgresMajorVersion: 16

services:
  - type: web
    name: teremflow-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    preDeployCommand: bash -c "alembic upgrade head && python -c \"from app.db.session import SessionLocal; from app.db.init_db import ensure_seeded; db=SessionLocal(); ensure_seeded(db); db.close()\""
    startCommand: bash -c 'exec uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8000}'
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: teremflow-db
          property: connectionString
      - key: ENVIRONMENT
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: TASKS_DAILY_SECRET
        sync: false
      - key: WIPE_CASE_DATA_SECRET
        sync: false
      - key: CORS_ORIGINS
        value: https://teremflow-frontend.onrender.com

  - type: web
    name: teremflow-frontend
    runtime: static
    rootDir: frontend
    # VITE_GIT_SHA is set from RENDER_GIT_COMMIT at build time so footer shows frontend build sha.
    buildCommand: export VITE_GIT_SHA="${RENDER_GIT_COMMIT:-unknown}" && npm install --no-fund --no-audit && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://teremflow-api.onrender.com

  - type: cron
    name: teremflow-daily-tasks
    runtime: node
    schedule: "0 6 * * *" # daily 06:00 UTC
    buildCommand: ""
    # 429 = Render rate limit; resilient retry strategy to avoid false failures
    startCommand: >
      node -e "
      const api=process.env.API_URL;
      const tok=process.env.TASKS_DAILY_SECRET;
      if(!api){console.error('Missing API_URL'); process.exit(1);}
      if(!tok){console.error('Missing TASKS_DAILY_SECRET'); process.exit(1);}
      const url=api+'/tasks/daily';
      const opts={method:'POST',headers:{'X-Tasks-Token':tok}};
      const maxAttempts=12; // total attempts
      const baseDelayMs=120000; // 2 minutes
      const minDelayMs=60000;   // 1 minute floor
      const maxDelayMs=900000;  // 15 minutes cap
      const requestTimeoutMs=45000;
      const sleep=(ms)=>new Promise(x=>setTimeout(x,ms));
      function clamp(ms){return Math.min(maxDelayMs, Math.max(minDelayMs, ms));}
      function parseRetryAfterMs(value){
        if(!value) return null;
        const v=String(value).trim();
        const seconds=Number(v);
        if(Number.isFinite(seconds) && seconds>0) return seconds*1000;
        const ts=Date.parse(v);
        if(Number.isFinite(ts)){
          const delta=ts-Date.now();
          if(delta>0) return delta;
        }
        return null;
      }
      function computeDelayMs(attempt, retryAfterHeader){
        const fromHeader=parseRetryAfterMs(retryAfterHeader);
        if(fromHeader!=null) return clamp(fromHeader);
        const exponential=baseDelayMs*Math.pow(1.5, Math.max(0, attempt-1));
        const jitter=exponential*(Math.random()*0.2-0.1); // +-10%
        return clamp(Math.round(exponential+jitter));
      }
      async function fetchWithTimeout(input, init){
        const controller=new AbortController();
        const timer=setTimeout(()=>controller.abort(), requestTimeoutMs);
        try{
          return await fetch(input,{...init, signal: controller.signal});
        } finally {
          clearTimeout(timer);
        }
      }
      async function run(attempt){
        const attemptNo=attempt+1;
        try{
          const r=await fetchWithTimeout(url,opts);
          const t=await r.text();
          console.log(t);
          if(r.ok){process.exit(0);}
          const canRetry=(r.status===429||r.status>=500)&&attemptNo<maxAttempts;
          if(canRetry){
            const delayMs=computeDelayMs(attemptNo, r.headers.get('retry-after'));
            console.error('HTTP '+r.status+' - retrying in '+Math.round(delayMs/1000)+'s (attempt '+attemptNo+'/'+maxAttempts+')');
            await sleep(delayMs);
            return run(attempt+1);
          }
          console.error('HTTP '+r.status);
          process.exit(1);
        } catch(e){
          if(attemptNo<maxAttempts){
            const delayMs=computeDelayMs(attemptNo, null);
            console.error('Request failed: '+(e && e.message ? e.message : String(e))+' - retrying in '+Math.round(delayMs/1000)+'s (attempt '+attemptNo+'/'+maxAttempts+')');
            await sleep(delayMs);
            return run(attempt+1);
          }
          console.error(e);
          process.exit(1);
        }
      }
      async function warmUp(attempt){
        const attemptNo=attempt+1;
        const warmUrl=api+'/health';
        try{
          const r=await fetchWithTimeout(warmUrl,{method:'GET'});
          if(r.ok){ return; }
          const canRetry=(r.status===429||r.status>=500)&&attemptNo<maxAttempts;
          if(canRetry){
            const delayMs=computeDelayMs(attemptNo, r.headers.get('retry-after'));
            console.error('Warmup HTTP '+r.status+' - retrying in '+Math.round(delayMs/1000)+'s (attempt '+attemptNo+'/'+maxAttempts+')');
            await sleep(delayMs);
            return warmUp(attempt+1);
          }
          console.error('Warmup HTTP '+r.status+' - continuing to tasks endpoint');
        } catch(e){
          if(attemptNo<maxAttempts){
            const delayMs=computeDelayMs(attemptNo, null);
            console.error('Warmup request failed: '+(e && e.message ? e.message : String(e))+' - retrying in '+Math.round(delayMs/1000)+'s (attempt '+attemptNo+'/'+maxAttempts+')');
            await sleep(delayMs);
            return warmUp(attempt+1);
          }
          console.error('Warmup failed repeatedly - continuing to tasks endpoint');
        }
      }
      warmUp(0).then(()=>run(0)).catch(e=>{console.error(e);process.exit(1);});
      "
    envVars:
      - key: API_URL
        value: https://teremflow-api.onrender.com
      - key: TASKS_DAILY_SECRET
        sync: false


