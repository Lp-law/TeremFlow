# TeremFlow — Render Blueprint
# After first deploy: In Dashboard set TASKS_DAILY_SECRET (same value) on BOTH teremflow-api and teremflow-daily-tasks.

databases:
  - name: teremflow-db
    plan: basic-1gb
    postgresMajorVersion: 16

services:
  - type: web
    name: teremflow-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: bash start.sh
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: teremflow-db
          property: connectionString
      - key: ENVIRONMENT
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: TASKS_DAILY_SECRET
        sync: false
      - key: WIPE_CASE_DATA_SECRET
        sync: false
      - key: CORS_ORIGINS
        value: https://teremflow-frontend.onrender.com

  - type: web
    name: teremflow-frontend
    runtime: static
    rootDir: frontend
    # VITE_GIT_SHA is set from RENDER_GIT_COMMIT at build time so footer shows frontend build sha.
    buildCommand: export VITE_GIT_SHA="${RENDER_GIT_COMMIT:-unknown}" && npm install --no-fund --no-audit && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://teremflow-api.onrender.com

  - type: cron
    name: teremflow-daily-tasks
    runtime: node
    schedule: "0 6 * * *" # daily 06:00 UTC
    buildCommand: ""
    # 429 = Render rate limit; more retries + longer delay + Retry-After to improve success
    startCommand: >
      node -e "
      const api=process.env.API_URL;
      const tok=process.env.TASKS_DAILY_SECRET;
      if(!api){console.error('Missing API_URL'); process.exit(1);}
      if(!tok){console.error('Missing TASKS_DAILY_SECRET'); process.exit(1);}
      const url=api+'/tasks/daily';
      const opts={method:'POST',headers:{'X-Tasks-Token':tok}};
      const maxAttempts=5;
      const defaultDelayMs=90000;
      async function run(attempt){
        const r=await fetch(url,opts);
        const t=await r.text();
        console.log(t);
        if(r.ok){process.exit(0);}
        const retryable=(r.status===429||r.status>=500)&&attempt<maxAttempts;
        if(retryable){
          let delayMs=defaultDelayMs;
          const ra=r.headers.get('retry-after');
          if(ra){const s=parseInt(ra,10); if(!isNaN(s)&&s>0) delayMs=Math.min(300000, Math.max(60000, s*1000));}
          console.error('HTTP '+r.status+' - retrying in '+Math.round(delayMs/1000)+'s (attempt '+(attempt+1)+'/'+maxAttempts+')');
          await new Promise(x=>setTimeout(x,delayMs));
          return run(attempt+1);
        }
        console.error('HTTP '+r.status);
        process.exit(1);
      }
      run(0).catch(e=>{console.error(e);process.exit(1);});
      "
    envVars:
      - key: API_URL
        value: https://teremflow-api.onrender.com
      - key: TASKS_DAILY_SECRET
        sync: false


